<!--  DOCTYPE - Serve para informar ao navegador que estamos usando HTML5  -->
<!DOCTYPE html>


<!-- HTML - É a tag principal da página. Tudo relacionado ao HTML fica dentro dela  -->
<html lang="pt-br">

<!-- lang/language = É um atributo e serve para configurarar/informar o idioma da página. Por padrão, vem configurado como en(English), mas pode ser configurado para o idioma de quem está escrevendo o documento HTML -->


 <!-- Head/cabeça do documento - Essa área é responsavel por guardar informaçoes sobre a página. Chamamos de área invisivel, pois somente algumas informações ficavam vísiveis para o usuário, como por exemplo, o nome da página na aba do navegador, ou a descrição quando o usuário faz alguma busca.  -->
<head>

    <!-- Essa metatag serve para informar para o navegador qual conjunto de caracteres a página utiliza. Isso compatibilidade entre sistemas mais antigos, além de exibir da forma correta, palavras com acentos e caracteres especiais -->
    <meta charset="UTF-8">


    <!-- Essa configuração serve para ajudar o navegador a entender como a página deve ser exibida de acordo com o amanho da tela. Em resumo, ajuda a página a funcionar corretamente em diferentes tamanhos de tela -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


<!-- title/título - Serve para definir o título da página que aparece, por exemplo, na aba do navegador -->
    <title>Olá Mundo</title>
</head>



<body>
    Olá Mundo. Este é o meu primeiro programa em HTML5.



</body>
</html>
