<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <meta name="description" content="Conteúdo sobre o uso e aplicação de iframes no HTML.">
    <title> Sobre Iframes | HTML </title>
</head>

<body>
     <h1> O que é um Iframe ? </h1>    
     <p> Iframe significa <strong> inline frame </strong>. </p>
     <p> Ele permite que voce <strong> incorpore </strong> outra página/documento dentro da sua própria página HTML. </p>

     <hr>
   
     <h2> Criando um iframe básico. </h2>
     <iframe src="03-listas.html" frameborder="1" width="450"  height="550" ></iframe>

<hr>
     <h2> Explorando outras formas de trabalhar com o iframe. </h2>
     <h3> Incorporando o Youtube. </h3>
     <iframe
       width="560"
       height="315"
       src="https://www.youtube.com/embed/O-7GhQzpCuw?si=7nUrxenm4d6hcZQt"
       title="YouTube video player vídeo de uns dos episódios de natal do desenho Pica-Pau" frameborder="0"
       allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope;
       picture-in-picture; web-share"
       referrerpolicy="strict-origin-when-cross-origin"
       allowfullscreen
       ></iframe>

     <h3> Incorporando um mapa no site. </h3>
     <iframe
       src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d14622.285993933468!2d-46.63545292023155!3d-23.61969590041065!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x94ce5ba985dae345%3A0xc2c122eafc723560!2sPlaza%20Sul%20Shopping!5e0!3m2!1spt-BR!2sbr!4v1790213035246!5m2!1spt-BR!2sbr" width="600"
       height="450"
       style="border:0;" allowfullscreen=""
       loading="lazy"
       referrerpolicy="strict-origin-when-cross-origin"
     ></iframe>
     
     
</body>

</html>
